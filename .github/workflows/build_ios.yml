name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên GitHub bất cứ lúc nào
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned / Ad-hoc)
    runs-on: macos-15 # Máy Mac Apple Silicon macOS 15 Sequoia (Xcode 16.2+ / Swift 6.2+)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Configure CocoaPods & Disable SwiftPM
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/iphoneos

      - name: Install dependencies & Generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs || dart run build_runner build
          cd ios && pod install && cd ..

      - name: Build Android APK (.apk)
        run: |
          flutter build apk --release

      - name: Build iOS App (.app)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          cp ios/Runner/GoogleService-Info.plist build/ios/iphoneos/Runner.app/GoogleService-Info.plist || true
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SoThuChi.ipa Payload
          cd ../../..

      - name: Upload IPA & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Builds
          path: |
            build/ios/iphoneos/SoThuChi.ipa
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

