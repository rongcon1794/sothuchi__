name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên GitHub bất cứ lúc nào
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest # Chạy trên Ubuntu với tài nguyên dồi dào, bắt đầu ngay lập tức không bị nghẽn queue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies & Generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs || dart run build_runner build

      - name: Build Android APK (.apk)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building Android APK..."
            flutter build apk --release && break || {
              if [ $i -lt 3 ]; then
                echo "Build failed on attempt $i due to transient network error, retrying in 15s..."
                sleep 15
              else
                echo "Build failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS IPA (Unsigned / Ad-hoc)
    runs-on: macos-15 # Bắt buộc dùng macOS 15 Sequoia (chứa Xcode 16+ & Swift 6 cần thiết cho Firebase iOS SDK 11+)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Configure CocoaPods & Disable SwiftPM
        run: |
          flutter config --no-enable-swift-package-manager
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          mkdir -p build/ios/iphoneos

      - name: Install dependencies & Generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs || dart run build_runner build
          for i in 1 2 3; do
            echo "Attempt $i: Running pod install..."
            (cd ios && pod install --repo-update) && break || {
              if [ $i -lt 3 ]; then
                echo "pod install failed on attempt $i due to transient git/CDN reset, retrying in 15s..."
                sleep 15
              else
                echo "pod install failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Build iOS App (.app)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building iOS app..."
            flutter build ios --release --no-codesign && break || {
              if [ $i -lt 3 ]; then
                echo "flutter build ios failed on attempt $i, retrying in 15s..."
                sleep 15
              else
                echo "flutter build ios failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Package .app into .ipa
        run: |
          cp ios/Runner/GoogleService-Info.plist build/ios/iphoneos/Runner.app/GoogleService-Info.plist || true
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r SoThuChi.ipa Payload
          cd ../../..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-iOS-IPA
          path: build/ios/iphoneos/SoThuChi.ipa
          retention-days: 7
